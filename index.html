<!DOCTYPE html>
<html lang="zh-HK">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>命名練習：水果</title>
   <style>
       body{
           font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", Arial, sans-serif;
           display:flex;
           flex-direction:column;
           align-items:center;
           justify-content:space-between;
           min-height:100vh;
           margin:0;
           background:#f4f4f9;
           color:#333;
       }
       .container{
           width:92%;
           max-width:800px;
           text-align:center;
           padding:20px 12px;
           display:flex;
           flex-direction:column;
           align-items:center;
           flex-grow:1;
           box-sizing:border-box;
       }
       h1{margin-bottom:12px;font-size:2em;}

       /* 視覺狀態回饋標籤 */
       #status-badge {
           display: none;
           padding: 10px 26px;
           border-radius: 30px;
           font-size: clamp(1.15rem, 4.2vw, 1.35rem);
           font-weight: bold;
           margin-bottom: 15px;
           transition: all 0.3s ease;
           white-space: nowrap;
       }
       .status-speaking {
           background-color: #fff3cd;
           color: #856404;
           border: 2px solid #ffeeba;
       }
       .status-listening {
           background-color: #d4edda;
           color: #155724;
           border: 2px solid #28a745;
           animation: pulse-green 1.5s infinite;
       }
       .status-idle {
           background-color: #e2e3e5;
           color: #383d41;
           border: 2px solid #d6d8db;
       }
       @keyframes pulse-green {
           0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.45); }
           70% { box-shadow: 0 0 0 12px rgba(40, 167, 69, 0); }
           100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
       }

       #item-image{
           max-width:90%;
           height:auto;
           max-height:48vh;
           border:5px solid #fff;
           box-shadow:0 4px 15px rgba(0,0,0,.1);
           border-radius:12px;
           margin:10px auto;
           display:block;
           transition: border-color 0.3s ease, box-shadow 0.3s ease;
       }
       #item-image.listening-highlight {
           border-color: #28a745;
           box-shadow: 0 0 20px rgba(40, 167, 69, 0.35);
       }

       #message{
           font-size: clamp(1.5rem, 5vw, 2.1rem);
           min-height:60px;
           margin:12px 0;
           font-weight:bold;
           line-height:1.4;
       }

       .btn-base {
           color: #fff;
           border: none;
           border-radius: 12px;
           cursor: pointer;
           white-space: nowrap;
           touch-action: manipulation;
       }
       #cue-button{
           background:#007bff;
           padding:14px 40px;
           font-size:1.5em;
           margin:10px 0;
       }
       #cue-button:hover{background:#0056b3}

       #perm-button{
           background:#ff9800;
           padding: 16px 24px;
           font-size: clamp(1.15rem, 4.3vw, 1.55rem);
           max-width: 100%;
           box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
       }
       #perm-button:hover{background:#e68900}

       .action-buttons {
           display: flex;
           flex-direction: column;
           align-items: center;
           gap: 14px;
           width: 100%;
           margin-top: 10px;
       }

       #review-wrong-button{
           background:#ff9800;
           padding: 16px 32px;
           font-size: clamp(1.2rem, 4.5vw, 1.55rem);
           display:none;
           box-shadow: 0 4px 10px rgba(255, 152, 0, 0.25);
       }
       #review-wrong-button:hover{background:#e68900}

       #start-button{
           background:#28a745;
           padding: 16px 42px;
           font-size: clamp(1.25rem, 4.8vw, 1.65rem);
           display:none;
       }
       #start-button:hover{background:#1e7e34}

       /* 成績總結表樣式 */
       #summary-container {
           display: none;
           width: 100%;
           max-width: 600px;
           background: #fff;
           border-radius: 14px;
           padding: 18px 16px;
           box-shadow: 0 4px 15px rgba(0,0,0,0.08);
           margin: 8px 0 18px 0;
           text-align: left;
           box-sizing: border-box;
       }
       .summary-header {
           font-size: clamp(1.25rem, 4.6vw, 1.55rem);
           font-weight: bold;
           text-align: center;
           white-space: nowrap;
           margin-bottom: 12px;
           padding-bottom: 10px;
           border-bottom: 2px solid #f0f0f0;
       }
       .summary-list {
           list-style: none;
           padding: 0;
           margin: 0;
       }
       .summary-item {
           display: flex;
           justify-content: space-between;
           align-items: center;
           padding: 12px 10px;
           border-bottom: 1px solid #eee;
           font-size: clamp(1.15rem, 4.2vw, 1.35rem);
       }
       .summary-item:last-child { border-bottom: none; }
       .summary-word { font-weight: bold; color: #222; }
       .badge-correct, .badge-cue, .badge-repeat {
           padding: 5px 12px;
           border-radius: 20px;
           font-weight: bold;
           font-size: 0.9em;
           white-space: nowrap;
       }
       .badge-correct { background: #d4edda; color: #155724; }
       .badge-cue { background: #fff3cd; color: #856404; }
       .badge-repeat { background: #f8d7da; color: #721c24; }

       /* 進度條樣式：文字永遠置中，進度條作為背景填滿 */
       .progress-bar-container{
           width:100%;
           max-width:800px;
           margin-top:auto;
           padding:10px;
           background:#e9ecef;
           border-top:1px solid #ddd;
           box-sizing:border-box;
       }
       .progress-track{
           position:relative;
           width:100%;
           height:38px;
           background:#dee2e6;
           border-radius:6px;
           overflow:hidden;
       }
       #progress-bar{
           height:100%;
           width:0%;
           background:#ffc107;
           transition:width .5s, background-color .3s;
       }
       #progress-text{
           position:absolute;
           inset:0;
           display:flex;
           align-items:center;
           justify-content:center;
           font-weight:bold;
           font-size:1.3em;
           color:#333;
           pointer-events:none;
       }
   </style>
</head>
<body>
   <div class="container">
       <h1>命名練習：水果</h1>
       <div id="status-badge" class="status-idle">準備中...</div>
       <img id="item-image" src="" alt="目標物品圖片" style="display:none">
       <button id="cue-button" class="btn-base" style="display:none">提示</button>
       <div id="message">開啟麥克風及聲音權限</div>
       
       <div id="summary-container">
           <div class="summary-header" id="summary-score">練習記錄</div>
           <ul class="summary-list" id="summary-list"></ul>
       </div>

       <button id="perm-button" class="btn-base">🎤 開啟麥克風及聲音權限</button>
       
       <div class="action-buttons">
           <button id="review-wrong-button" class="btn-base">🔄 重溫做錯嘅題目</button>
           <button id="start-button" class="btn-base">開始練習</button>
       </div>
   </div>
   <div class="progress-bar-container">
       <div class="progress-track">
           <div id="progress-bar"></div>
           <div id="progress-text">0/6</div>
       </div>
   </div>

   <script>
       const ANSWER_TIME_LIMIT_MS = 10000;
       const REPEAT_TIME_LIMIT_MS = 8000;

       const allQuestions = [
           {word:"蘋果",image:"蘋果.jpg",phonemic_cue:"蘋",correct_aliases:["蘋果"]},
           {word:"香蕉",image:"香蕉.jpg",phonemic_cue:"香",correct_aliases:["香蕉","蕉"]},
           {word:"芒果",image:"芒果.jpg",phonemic_cue:"芒",correct_aliases:["芒果","芒"]},
           {word:"士多啤梨",image:"士多啤梨.jpg",phonemic_cue:"士",correct_aliases:["士多啤梨","草莓"]},
           {word:"奇異果",image:"奇異果.jpg",phonemic_cue:"奇",correct_aliases:["奇異果","獼猴桃"]},
           {word:"西瓜",image:"西瓜.jpg",phonemic_cue:"西",correct_aliases:["西瓜"]}
       ];

       let activeQuestions = [...allQuestions];
       let currentQuestionIndex = 0;
       let currentCueLevel = 0;
       let timer = null;
       let listenDelayTimer = null;
       let speakFallbackTimer = null;
       let correctAnswered = false;
       let isWaitingForAnswer = false;
       let isRepeatStage = false;
       let isSpeakingNow = false;
       let listenStartTime = 0;
       let cueLock = false;
       let speakCancelToken = 0;
       let preferredVoice = null;
       let resultsRecord = [];
       let wakeLock = null;
       let recognition = null;

       const imageElement = document.getElementById('item-image');
       const messageElement = document.getElementById('message');
       const progressBarElement = document.getElementById('progress-bar');
       const progressTextElement = document.getElementById('progress-text');
       const cueButton = document.getElementById('cue-button');
       const permButton = document.getElementById('perm-button');
       const startButton = document.getElementById('start-button');
       const reviewWrongButton = document.getElementById('review-wrong-button');
       const statusBadge = document.getElementById('status-badge');
       const summaryContainer = document.getElementById('summary-container');
       const summaryList = document.getElementById('summary-list');
       const summaryScore = document.getElementById('summary-score');
       const synth = window.speechSynthesis || null;

       function shuffleArray(arr) {
           for (let i = arr.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [arr[i], arr[j]] = [arr[j], arr[i]];
           }
       }

       function preloadImages() {
           allQuestions.forEach(q => { new Image().src = q.image; });
       }

       async function requestWakeLock() {
           if ('wakeLock' in navigator) {
               try {
                   wakeLock = await navigator.wakeLock.request('screen');
                   wakeLock.addEventListener('release', () => { wakeLock = null; });
               } catch (err) {}
           }
       }

       function releaseWakeLock() {
           if (wakeLock !== null) {
               wakeLock.release().then(() => { wakeLock = null; }).catch(() => {});
           }
       }

       document.addEventListener('visibilitychange', async () => {
           if (document.visibilityState === 'visible' && startButton.style.display === 'none' && permButton.style.display === 'none') {
               await requestWakeLock();
           }
       });

       function loadBestCantoneseVoice() {
           if (!synth) return;
           try {
               const hkVoices = synth.getVoices().filter(v => v.lang.toLowerCase().includes('zh-hk') || v.lang.toLowerCase().includes('yue'));
               if (hkVoices.length > 0) {
                   preferredVoice =
                       hkVoices.find(v => /enhanced|premium|natural/i.test(v.name)) ||
                       hkVoices.find(v => /sinji/i.test(v.name)) ||
                       hkVoices[0];
               }
           } catch (e) {}
       }
       if (synth && synth.onvoiceschanged !== undefined) {
           synth.onvoiceschanged = loadBestCantoneseVoice;
       }
       loadBestCantoneseVoice();

       function unlockSpeechSynthesis() {
           if (!synth) return;
           try {
               loadBestCantoneseVoice();
               const silentUtt = new SpeechSynthesisUtterance(' ');
               silentUtt.lang = 'zh-HK';
               if (preferredVoice) silentUtt.voice = preferredVoice;
               silentUtt.volume = 0;
               synth.speak(silentUtt);
           } catch (e) {}
       }

       function checkRecognitionSupport(){
           const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
           if(!SpeechRec){
               messageElement.textContent="瀏覽器唔支援語音辨識，建議使用 Safari 或 Chrome";
               permButton.disabled=true;
               startButton.disabled=true;
               return false;
           }
           return true;
       }

       permButton.addEventListener('click', async () => {
           if (!checkRecognitionSupport()) return;
           unlockSpeechSynthesis();

           permButton.disabled = true;
           permButton.textContent = "正在開啟權限...";

           try {
               if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                   const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                   stream.getTracks().forEach(track => track.stop());
               }
               permButton.style.display = 'none';
               startButton.style.display = 'block';
               messageElement.textContent = "✅ 已準備好，請按「開始練習」";
           } catch (err) {
               permButton.disabled = false;
               permButton.textContent = "🎤 重新開啟麥克風權限";
               messageElement.textContent = "⚠️ 未能開啟麥克風，請允許使用麥克風或檢查網址是否 HTTPS";
           }
       });

       function setVisualStatus(state) {
           statusBadge.style.display = 'inline-block';
           statusBadge.className = '';
           imageElement.classList.remove('listening-highlight');

           if (state === 'speaking') {
               statusBadge.textContent = '🔊 系統發問中...';
               statusBadge.classList.add('status-speaking');
           } else if (state === 'listening') {
               statusBadge.textContent = isRepeatStage ? '🎤 請跟住讀一次...' : '🎤 請讀出答案...';
               statusBadge.classList.add('status-listening');
               imageElement.classList.add('listening-highlight');
           } else if (state === 'idle') {
               statusBadge.textContent = '⏳ 準備中...';
               statusBadge.classList.add('status-idle');
           } else if (state === 'hidden') {
               statusBadge.style.display = 'none';
           }
       }

       function setupRecognitionInstance(){
           const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
           if(!SpeechRec) return;

           if(recognition){
               try{
                   recognition.onresult = null;
                   recognition.onend = null;
                   recognition.abort();
               }catch(e){}
           }
           recognition = new SpeechRec();
           recognition.lang = 'zh-HK';
           recognition.interimResults = true;
           recognition.continuous = false;

           recognition.onresult = e => {
               if(!isWaitingForAnswer || correctAnswered) return;

               let transcript = '';
               let isFinal = false;
               for (let i = e.resultIndex; i < e.results.length; i++) {
                   transcript += e.results[i][0].transcript;
                   if (e.results[i].isFinal) isFinal = true;
               }
               transcript = transcript.trim();
               if(!transcript) return;

               const q = activeQuestions[currentQuestionIndex];
               const isMatch = q.correct_aliases.some(a => transcript.toLowerCase().includes(a.toLowerCase()));

               if (isMatch || (!isSpeakingNow && isFinal)) {
                   isWaitingForAnswer = false;
                   clearTimeout(timer);
                   clearTimeout(listenDelayTimer);
                   setVisualStatus('idle');
                   checkAnswer(transcript);
               }
           };

           recognition.onend = () => {
               if(isWaitingForAnswer && !correctAnswered){
                   clearTimeout(listenDelayTimer);
                   listenDelayTimer = setTimeout(() => {
                       if(isWaitingForAnswer && !correctAnswered){
                           try {
                               setupRecognitionInstance();
                               recognition.start();
                               if (!isSpeakingNow) setVisualStatus('listening');
                           } catch(err) {}
                       }
                   }, 300);
               }
           };
       }

       function createNaturalUtterance(txt, rate = 0.92, pitch = 1.08) {
           const u = new SpeechSynthesisUtterance(txt);
           u.lang = 'zh-HK';
           if (preferredVoice) u.voice = preferredVoice;
           u.rate = rate;
           u.pitch = pitch;
           return u;
       }

       function speak(text, callback, allowBargeIn = false){
           clearTimeout(speakFallbackTimer);
           speakCancelToken++;
           const currentToken = speakCancelToken;

           if(!synth){
               setVisualStatus('idle');
               if(callback) callback();
               return;
           }
           try {
               if(synth.speaking || synth.pending) synth.cancel();
           } catch (e) {}

           isSpeakingNow = true;
           if (!allowBargeIn) {
               try{ recognition?.abort(); }catch(e){}
           }
           setVisualStatus('speaking');

           let finished = false;
           const done = () => {
               if(finished || currentToken !== speakCancelToken) return;
               finished = true;
               clearTimeout(speakFallbackTimer);
               isSpeakingNow = false;
               if (!allowBargeIn) setVisualStatus('idle');
               if(callback) callback();
           };

           speakFallbackTimer = setTimeout(done, 8000);

           setTimeout(() => {
               if(finished || currentToken !== speakCancelToken) return;

               if(currentCueLevel === 1 && text === ""){
                    const ch = activeQuestions[currentQuestionIndex].phonemic_cue;
                    const a = createNaturalUtterance("提示一下，呢個係", 0.92, 1.08);
                    const b = createNaturalUtterance(ch, 0.6, 1.05);
                    a.onend = () => {
                        setTimeout(() => {
                            if(!finished && currentToken === speakCancelToken) synth.speak(b);
                        }, 220);
                    };
                    b.onend = done;
                    synth.speak(a);
                    return;
               }

               const segments = text.split(/[，。！？、]/).map(s => s.trim()).filter(s => s.length > 0);
               if (segments.length === 0) {
                   done();
                   return;
               }

               let idx = 0;
               function speakNextSegment() {
                   if (finished || currentToken !== speakCancelToken) return;
                   if (idx >= segments.length) {
                       done();
                       return;
                   }
                   const seg = segments[idx];
                   const isSingleTargetWord = (isRepeatStage && idx === segments.length - 1);
                   const u = createNaturalUtterance(seg, isSingleTargetWord ? 0.72 : 0.92, 1.08);
                   u.onend = () => {
                       idx++;
                       setTimeout(speakNextSegment, 220);
                   };
                   synth.speak(u);
               }

               speakNextSegment();
           }, 50);
       }

       function updateProgress(){
           const displayIndex = Math.max(0, currentQuestionIndex);
           const p = (displayIndex / activeQuestions.length) * 100;
           progressBarElement.style.width = p + '%';
           progressTextElement.textContent = displayIndex + '/' + activeQuestions.length;
           if(displayIndex === activeQuestions.length) progressBarElement.style.backgroundColor = '#28a745';
       }

       function beginImmediateListening() {
           if (correctAnswered) return;
           clearTimeout(listenDelayTimer);
           isWaitingForAnswer = true;
           listenStartTime = Date.now();
           try {
               setupRecognitionInstance();
               recognition.start();
           } catch(e) {}
       }

       function startAnswerTimer(durationMs = ANSWER_TIME_LIMIT_MS){
           if(correctAnswered || !isWaitingForAnswer) return;
           clearTimeout(timer);

           listenStartTime = Date.now();
           setVisualStatus('listening');

           timer = setTimeout(() => {
               if(correctAnswered || !isWaitingForAnswer) return;
               isWaitingForAnswer = false;
               try{ recognition?.abort(); }catch(e){}
               setVisualStatus('idle');

               if (isRepeatStage) handleRepeatTimeout();
               else setTimeout(moveToNextCue, 600);
           }, durationMs);
       }

       function checkAnswer(ans){
           const q = activeQuestions[currentQuestionIndex];
           const matchedAlias = q.correct_aliases.find(a => ans.toLowerCase().includes(a.toLowerCase()));
           const elapsed = Date.now() - listenStartTime;

           if(matchedAlias){
                correctAnswered = true;
                speakCancelToken++;
                try{ recognition?.abort(); }catch(e){}
                try{ if(synth && synth.speaking) synth.cancel(); }catch(e){}
                isSpeakingNow = false;
                cueButton.style.display = 'none';

                const spokenWord = (q.word === "士多啤梨" && matchedAlias === "草莓") ? "草莓" : q.word;

                if (isRepeatStage) {
                    recordResult(q, 'repeat_success', spokenWord);
                    setTimeout(() => handleRepeatCorrect(spokenWord), 100);
                } else {
                    recordResult(q, currentCueLevel === 0 ? 'independent' : 'cued', spokenWord);
                    setTimeout(() => handleCorrectAnswer(spokenWord), 100);
                }
           }else{
                try{ recognition?.abort(); }catch(e){}
                if(elapsed < 1200){
                    isWaitingForAnswer = true;
                    startAnswerTimer(isRepeatStage ? REPEAT_TIME_LIMIT_MS : ANSWER_TIME_LIMIT_MS);
                    return;
                }

                if (isRepeatStage) handleRepeatTimeout();
                else setTimeout(moveToNextCue, 1000);
           }
       }

       function recordResult(questionObj, status, displayWord = questionObj.word) {
           if (!resultsRecord.some(r => r.question.word === questionObj.word)) {
               resultsRecord.push({ question: questionObj, word: displayWord, status });
           }
       }

       function handleCorrectAnswer(w){
           currentCueLevel = 0;
           isRepeatStage = false;
           messageElement.textContent = w;
           const praise = ["啱喇", "好叻呀", "答啱晒", "冇錯"][Math.floor(Math.random()*4)];
           speak(`${praise}！呢個就係${w}`, () => setTimeout(moveToNextQuestion, 900), false);
       }

       function handleRepeatCorrect(w){
           currentCueLevel = 0;
           isRepeatStage = false;
           messageElement.textContent = w;
           const praise = [
               `啱喇！讀得好清楚，呢個就係${w}`,
               `好叻呀！跟得非常之啱，係${w}`,
               `冇錯！好標準呀，呢個就係${w}`
           ][Math.floor(Math.random()*3)];
           speak(praise, () => setTimeout(moveToNextQuestion, 900), false);
       }

       function handleRepeatTimeout(){
           const q = activeQuestions[currentQuestionIndex];
           recordResult(q, 'repeat_missed', q.word);
           isRepeatStage = false;
           currentCueLevel = 0;
           speak(`唔緊要，記住呢個係${q.word}，我哋試下下一題`, () => setTimeout(moveToNextQuestion, 800), false);
       }

       function moveToNextCue(){
           clearTimeout(timer);
           clearTimeout(listenDelayTimer);
           isWaitingForAnswer = false;

           if(correctAnswered) return;
           currentCueLevel++;
           const q = activeQuestions[currentQuestionIndex];
           messageElement.textContent = "";
           if(currentCueLevel === 1) {
               beginImmediateListening();
               speak("", () => startAnswerTimer(ANSWER_TIME_LIMIT_MS), true);
           } else {
               cueButton.style.display = 'none';
               handleFinalAnswer(q.word);
           }
       }

       function handleFinalAnswer(w){
           clearTimeout(timer);
           clearTimeout(listenDelayTimer);
           isWaitingForAnswer = false;
           isRepeatStage = true;
           messageElement.textContent = w;
           beginImmediateListening();
           speak(`呢個係${w}，你試下讀一次，${w}`, () => startAnswerTimer(REPEAT_TIME_LIMIT_MS), true);
       }

       function moveToNextQuestion(){
           clearTimeout(timer);
           clearTimeout(listenDelayTimer);
           isWaitingForAnswer = false;
           isRepeatStage = false;
           currentQuestionIndex++;
           currentCueLevel = 0;
           correctAnswered = false;
           updateProgress();
           if(currentQuestionIndex < activeQuestions.length) loadQuestion(currentQuestionIndex);
           else handleCompletion();
       }

       function loadQuestion(i){
           const q = activeQuestions[i];
           imageElement.src = q.image;
           imageElement.style.display = 'block';
           cueButton.style.display = 'block';
           messageElement.textContent = "";

           beginImmediateListening();
           speak("呢個咩嚟架？", () => startAnswerTimer(ANSWER_TIME_LIMIT_MS), true);
       }

       function renderSummaryTable() {
           summaryList.innerHTML = '';
           let independentCount = 0;
           let cuedCount = 0;

           resultsRecord.forEach(item => {
               const li = document.createElement('li');
               li.className = 'summary-item';

               const wordSpan = document.createElement('span');
               wordSpan.className = 'summary-word';
               wordSpan.textContent = item.word;

               const statusSpan = document.createElement('span');
               if (item.status === 'independent') {
                   independentCount++;
                   statusSpan.className = 'badge-correct';
                   statusSpan.textContent = '✅ 自己答啱';
               } else if (item.status === 'cued') {
                   cuedCount++;
                   statusSpan.className = 'badge-cue';
                   statusSpan.textContent = '💡 提示後答啱';
               } else if (item.status === 'repeat_success') {
                   statusSpan.className = 'badge-repeat';
                   statusSpan.textContent = '🗣️ 跟讀答啱';
               } else {
                   statusSpan.className = 'badge-repeat';
                   statusSpan.textContent = '🔄 需再練習';
               }

               li.appendChild(wordSpan);
               li.appendChild(statusSpan);
               summaryList.appendChild(li);
           });

           const totalCorrect = independentCount + cuedCount;
           summaryScore.textContent = `答對：${totalCorrect} / ${activeQuestions.length} 題`;
           summaryContainer.style.display = 'block';

           const wrongItems = resultsRecord.filter(item => item.status !== 'independent');
           if (wrongItems.length > 0) {
               reviewWrongButton.style.display = 'block';
               reviewWrongButton.textContent = `🔄 重溫做錯嘅題目 (${wrongItems.length}題)`;
           } else {
               reviewWrongButton.style.display = 'none';
           }
       }

       function handleCompletion(){
           imageElement.style.display = 'none';
           cueButton.style.display = 'none';
           setVisualStatus('hidden');
           releaseWakeLock();
           messageElement.textContent = "做得非常好，完成練習喇！";
           renderSummaryTable();
           speak("做得非常好，我哋已經完成呢個練習喇！", null, false);
           startButton.style.display = 'block';
           startButton.textContent = '再練習全部題目';
       }

       function startPracticeSession(questionList) {
           if(!checkRecognitionSupport()) return;
           unlockSpeechSynthesis();
           requestWakeLock();

           activeQuestions = [...questionList];
           shuffleArray(activeQuestions);

           startButton.style.display = 'none';
           reviewWrongButton.style.display = 'none';
           summaryContainer.style.display = 'none';
           resultsRecord = [];
           currentQuestionIndex = -1;
           progressBarElement.style.backgroundColor = '#ffc107';
           updateProgress();
           moveToNextQuestion();
       }

       startButton.addEventListener('click', () => startPracticeSession(allQuestions));

       reviewWrongButton.addEventListener('click', () => {
           const wrongQuestions = resultsRecord
               .filter(item => item.status !== 'independent')
               .map(item => item.question);
           if (wrongQuestions.length > 0) startPracticeSession(wrongQuestions);
       });

       cueButton.addEventListener('click', () => {
           if(correctAnswered || cueLock || isRepeatStage) return;
           cueLock = true;
           setTimeout(() => { cueLock = false; }, 800);
           isWaitingForAnswer = false;
           clearTimeout(timer);
           clearTimeout(listenDelayTimer);
           clearTimeout(speakFallbackTimer);
           speakCancelToken++;
           try{ recognition?.abort(); }catch(e){}
           try{ if(synth && synth.speaking) synth.cancel(); }catch(e){}
           isSpeakingNow = false;
           setVisualStatus('idle');
           setTimeout(moveToNextCue, 100);
       });

       document.addEventListener('DOMContentLoaded', () => {
           updateProgress();
           preloadImages();
       });
   </script>
</body>
</html>
