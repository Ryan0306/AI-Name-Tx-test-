<!DOCTYPE html>
<html lang="zh-HK">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>命名練習：水果</title>
   <style>
       body{
           font-family:Arial,sans-serif;
           display:flex;
           flex-direction:column;
           align-items:center;
           justify-content:space-between;
           min-height:100vh;
           margin:0;
           background:#f4f4f9;
       }
       .container{
           width:90%;
           max-width:800px;
           text-align:center;
           padding:20px;
           display:flex;
           flex-direction:column;
           align-items:center;
           flex-grow:1;
       }
       h1{color:#333;margin-bottom:12px}

       /* 視覺狀態回饋標籤 */
       #status-badge {
           display: none;
           padding: 10px 24px;
           border-radius: 30px;
           font-size: 1.3em;
           font-weight: bold;
           margin-bottom: 15px;
           transition: all 0.3s ease;
       }
       .status-speaking {
           background-color: #fff3cd;
           color: #856404;
           border: 2px solid #ffeeba;
       }
       .status-listening {
           background-color: #d4edda;
           color: #155724;
           border: 2px solid #28a745;
           animation: pulse-green 1.5s infinite;
       }
       .status-idle {
           background-color: #e2e3e5;
           color: #383d41;
           border: 2px solid #d6d8db;
       }
       @keyframes pulse-green {
           0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.5); }
           70% { box-shadow: 0 0 0 12px rgba(40, 167, 69, 0); }
           100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
       }

       #item-image{
           max-width:90%;
           height:auto;
           max-height:52vh;
           border:5px solid #fff;
           box-shadow:0 4px 15px rgba(0,0,0,.1);
           border-radius:12px;
           margin:10px auto;
           display:block;
           transition: border-color 0.3s ease, box-shadow 0.3s ease;
       }
       /* 聆聽中圖片外框發光提示 */
       #item-image.listening-highlight {
           border-color: #28a745;
           box-shadow: 0 0 20px rgba(40, 167, 69, 0.35);
       }

       #message{
           font-size:2.4em;
           color:#333;
           min-height:75px;
           margin:15px 0;
           font-weight:bold;
       }
       #cue-button{
           background:#007bff;
           color:#fff;
           padding:14px 40px;
           font-size:1.5em;
           border:none;
           border-radius:10px;
           cursor:pointer;
           margin-top:12px;
           margin-bottom:15px;
       }
       #cue-button:hover{background:#0056b3}
       #start-button{
           background:#28a745;
           color:#fff;
           padding:16px 44px;
           font-size:1.7em;
           border:none;
           border-radius:10px;
           cursor:pointer;
       }
       #start-button:hover{background:#1e7e34}
       .progress-bar-container{
           width:100%;
           max-width:800px;
           margin-top:auto;
           padding:10px;
           background:#e9ecef;
           border-top:1px solid #ddd;
       }
       #progress-bar{
           height:38px;
           background:#ffc107;
           border-radius:6px;
           transition:width .5s;
           display:flex;
           align-items:center;
           justify-content:center;
           color:#333;
           font-weight:bold;
           font-size:1.3em;
       }
   </style>
</head>
<body>
   <div class="container">
       <h1>命名練習：水果</h1>
       <div id="status-badge" class="status-idle">準備中...</div>
       <img id="item-image" src="" alt="目標物品圖片" style="display:none">
       <button id="cue-button" style="display:none">提示</button>
       <div id="message"></div>
       <button id="start-button">開始練習</button>
   </div>
   <div class="progress-bar-container"><div id="progress-bar"></div></div>

   <script>
       // 1. 已將「橙」替換為「芒果」
       const questions = [
           {word:"蘋果",image:"蘋果.jpg",phonemic_cue:"蘋",correct_aliases:["蘋果"]},
           {word:"香蕉",image:"香蕉.jpg",phonemic_cue:"香",correct_aliases:["香蕉","蕉"]},
           {word:"芒果",image:"芒果.jpg",phonemic_cue:"芒",correct_aliases:["芒果"]},
           {word:"士多啤梨",image:"士多啤梨.jpg",phonemic_cue:"士",correct_aliases:["士多啤梨","草莓"]},
           {word:"奇異果",image:"奇異果.jpg",phonemic_cue:"奇",correct_aliases:["奇異果","獼猴桃"]},
           {word:"西瓜",image:"西瓜.jpg",phonemic_cue:"西",correct_aliases:["西瓜"]}
       ];

       let currentQuestionIndex=0, currentCueLevel=0, recognitionActive=false, timer, listenDelayTimer, correctAnswered=false;
       let isWaitingForAnswer = false;
       let activeUtterances = [];
       let isSpeakingNow = false;
       let listenStartTime = 0;
       let cueLock = false;
       let speakFallbackTimer = null;

       // 2. 防止螢幕休眠 (Wake Lock) 變數與函式
       let wakeLock = null;

       async function requestWakeLock() {
           if ('wakeLock' in navigator) {
               try {
                   wakeLock = await navigator.wakeLock.request('screen');
                   wakeLock.addEventListener('release', () => {
                       wakeLock = null;
                   });
               } catch (err) {
                   console.log('無法啟用螢幕長亮:', err.message);
               }
           }
       }

       function releaseWakeLock() {
           if (wakeLock !== null) {
               wakeLock.release().then(() => {
                   wakeLock = null;
               }).catch(() => {});
           }
       }

       // 當切換分頁或畫面重新顯示時，如果練習仍在進行中，自動重新鎖定螢幕長亮
       document.addEventListener('visibilitychange', async () => {
           if (document.visibilityState === 'visible' && startButton.style.display === 'none') {
               await requestWakeLock();
           }
       });

       const imageElement=document.getElementById('item-image');
       const messageElement=document.getElementById('message');
       const progressBarElement=document.getElementById('progress-bar');
       const cueButton=document.getElementById('cue-button');
       const startButton=document.getElementById('start-button');
       const statusBadge=document.getElementById('status-badge');
       const synth=window.speechSynthesis;
       let recognition=null;

       // 3. 更新視覺狀態回饋
       function setVisualStatus(state) {
           statusBadge.style.display = 'inline-block';
           statusBadge.className = '';
           imageElement.classList.remove('listening-highlight');

           if (state === 'speaking') {
               statusBadge.textContent = '🔊 系統發問中...';
               statusBadge.classList.add('status-speaking');
           } else if (state === 'listening') {
               statusBadge.textContent = '🎤 請講出答案...';
               statusBadge.classList.add('status-listening');
               imageElement.classList.add('listening-highlight');
           } else if (state === 'idle') {
               statusBadge.textContent = '⏳ 準備中...';
               statusBadge.classList.add('status-idle');
           } else if (state === 'hidden') {
               statusBadge.style.display = 'none';
           }
       }

       function checkRecognitionSupport(){
           if(!('SpeechRecognition'in window||'webkitSpeechRecognition'in window)){
               messageElement.textContent="瀏覽器唔支援語音辨識"; startButton.disabled=true; return false;
           }
           return true;
       }

       function setupRecognitionInstance(){
           if(recognition){
               try{
                   recognition.onresult=null;
                   recognition.onerror=null;
                   recognition.onend=null;
                   recognition.abort();
               }catch(e){}
               recognition=null;
           }
           recognition=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
           recognition.lang='zh-HK';
           recognition.interimResults=false;
           recognition.continuous=false;

           recognition.onresult=e=>{
               if(isSpeakingNow) return;
               const transcript = e.results[0][0].transcript.trim();
               if(!transcript) return;
               isWaitingForAnswer = false;
               clearTimeout(timer);
               clearTimeout(listenDelayTimer);
               recognitionActive=false;
               setVisualStatus('idle');
               checkAnswer(transcript);
           };

           recognition.onerror=e=>{
               recognitionActive=false;
           };

           recognition.onend=()=>{
               recognitionActive=false;
               if(isWaitingForAnswer && !correctAnswered && !isSpeakingNow && currentCueLevel < 2){
                   clearTimeout(listenDelayTimer);
                   listenDelayTimer=setTimeout(()=>{
                       if(isWaitingForAnswer && !correctAnswered && !isSpeakingNow && currentCueLevel < 2){
                           try {
                               setupRecognitionInstance();
                               recognition.start();
                               recognitionActive = true;
                               setVisualStatus('listening');
                           } catch(err) {}
                       }
                   }, 400);
               }
           };
       }

       function speak(text,callback){
           clearTimeout(speakFallbackTimer);
           if(!synth){
               setVisualStatus('idle');
               if(callback)callback();
               return;
           }
           isSpeakingNow = true;
           setVisualStatus('speaking');
           try{ recognition?.abort(); }catch(e){}
           recognitionActive = false;
           activeUtterances=[];

           let finished = false;
           const done = () => {
               if(finished) return;
               finished = true;
               clearTimeout(speakFallbackTimer);
               isSpeakingNow = false;
               setVisualStatus('idle');
               if(callback) callback();
           };

           // 保險機制：防止瀏覽器 TTS onend 偶發性失效導致卡死
           speakFallbackTimer = setTimeout(done, 6000);

           if(currentCueLevel===1){
                const ch=questions[currentQuestionIndex].phonemic_cue;
                const a=new SpeechSynthesisUtterance("呢個係");a.lang='zh-HK';a.rate=0.9;
                const b=new SpeechSynthesisUtterance(ch);b.lang='zh-HK';b.rate=0.25;
                activeUtterances.push(a,b);
                a.onend=()=>{synth.speak(b);b.onend=done;};
                synth.speak(a); return;
           }
           if(text.includes("你試下講一次")){
                const w=questions[currentQuestionIndex].word;
                const p1=`呢個係${w}，你試下講一次`;
                const u1=new SpeechSynthesisUtterance(p1);u1.lang='zh-HK';u1.rate=0.9;
                const u2=new SpeechSynthesisUtterance(w);u2.lang='zh-HK';u2.rate=0.4;
                activeUtterances.push(u1,u2);
                u1.onend=()=>{synth.speak(u2);u2.onend=done;};
                synth.speak(u1); return;
           }
           const cleanText = text.replace(/。/g, '');
           const utt=new SpeechSynthesisUtterance(cleanText);utt.lang='zh-HK';utt.rate=0.9;
           activeUtterances.push(utt);
           utt.onend=done;
           synth.speak(utt);
       }

       function updateProgress(){
           const p=(currentQuestionIndex/questions.length)*100;
           progressBarElement.style.width=p+'%';
           progressBarElement.textContent=currentQuestionIndex+'/'+questions.length;
           if(currentQuestionIndex===questions.length) progressBarElement.style.backgroundColor='#28a745';
       }

       function startListening(){
           if(correctAnswered) return;
           clearTimeout(listenDelayTimer);
           isWaitingForAnswer = true;
           setVisualStatus('idle');
           listenDelayTimer=setTimeout(()=>{
               if(!isWaitingForAnswer || correctAnswered || isSpeakingNow) return;
               try {
                   setupRecognitionInstance();
                   listenStartTime = Date.now();
                   recognition.start();
                   recognitionActive=true;
                   setVisualStatus('listening');
               } catch(e) {}
               startNextCueTimer();
           }, 850);
       }

       function startNextCueTimer(){
           clearTimeout(timer);
           timer=setTimeout(()=>{
               if(correctAnswered || !isWaitingForAnswer) return;
               isWaitingForAnswer = false;
               try{ recognition?.abort(); }catch(e){}
               recognitionActive=false;
               setVisualStatus('idle');
               setTimeout(moveToNextCue,1000);
           }, 10000);
       }

       function checkAnswer(ans){
           const q=questions[currentQuestionIndex];
           const correct=q.correct_aliases.some(a=>ans.toLowerCase().includes(a.toLowerCase()));
           const elapsed = Date.now() - listenStartTime;

           isWaitingForAnswer = false;
           clearTimeout(timer);
           clearTimeout(listenDelayTimer);

           if(correct){
                correctAnswered=true;
                try{ recognition?.abort(); }catch(e){}
                if(synth.speaking) synth.cancel();
                isSpeakingNow = false;
                cueButton.style.display='none';
                setTimeout(()=>handleCorrectAnswer(q.word),100);
           }else{
                try{ recognition?.abort(); }catch(e){}
                if(elapsed < 1200){
                    startListening();
                    return;
                }
                setTimeout(moveToNextCue,1500);
           }
       }

       function handleCorrectAnswer(w){
           currentCueLevel=0; correctAnswered=false;
           messageElement.textContent=w;
           const fb=["啱喇","冇錯","做得好"][Math.floor(Math.random()*3)]+`！呢個就係${w}`;
           speak(fb,()=>setTimeout(moveToNextQuestion,800));
       }

       function moveToNextCue(){
           clearTimeout(timer);
           clearTimeout(listenDelayTimer);
           isWaitingForAnswer = false;

           if(correctAnswered) return;
           currentCueLevel++;
           const q=questions[currentQuestionIndex];
           messageElement.textContent="";
           if(currentCueLevel===1) speak("",startListening);
           else{
                cueButton.style.display='none';
                handleFinalAnswer(q.word);
           }
       }

       function handleFinalAnswer(w){
           clearTimeout(timer);
           clearTimeout(listenDelayTimer);
           isWaitingForAnswer = false;
           currentCueLevel=0;
           messageElement.textContent=w;
           speak(`呢個係${w}，你試下講一次，${w}`,()=>setTimeout(moveToNextQuestion,3000));
       }

       function moveToNextQuestion(){
           clearTimeout(timer);
           clearTimeout(listenDelayTimer);
           isWaitingForAnswer = false;
           currentQuestionIndex++; currentCueLevel=0; correctAnswered=false; updateProgress();
           if(currentQuestionIndex<questions.length) loadQuestion(currentQuestionIndex);
           else handleCompletion();
       }

       function loadQuestion(i){
           const q=questions[i];
           imageElement.src=q.image;
           imageElement.style.display='block';
           cueButton.style.display='block';
           messageElement.textContent="";
           speak("呢個咩嚟架？",startListening);
       }

       function handleCompletion(){
           imageElement.style.display='none';
           cueButton.style.display='none';
           setVisualStatus('hidden');
           releaseWakeLock(); // 練習完成後釋放螢幕休眠鎖定
           messageElement.textContent="做得非常好，我哋已經完成呢個練習喇！";
           speak("做得非常好，我哋已經完成呢個練習喇！");
           startButton.style.display='block';
           startButton.textContent='重新開始';
       }

       startButton.onclick=async ()=>{
           if(!checkRecognitionSupport()) return;
           await requestWakeLock(); // 開始練習時鎖定螢幕長亮
           startButton.style.display='none';
           currentQuestionIndex=-1;
           progressBarElement.style.backgroundColor='#ffc107';
           updateProgress();
           moveToNextQuestion();
       };

       cueButton.onclick=()=>{
           if(correctAnswered || cueLock) return;
           cueLock = true;
           setTimeout(()=>{ cueLock = false; }, 800);
           isWaitingForAnswer = false;
           clearTimeout(timer);
           clearTimeout(listenDelayTimer);
           clearTimeout(speakFallbackTimer);
           try{ recognition?.abort(); }catch(e){}
           if(synth.speaking) synth.cancel();
           isSpeakingNow = false;
           setVisualStatus('idle');
           setTimeout(moveToNextCue,100);
       };

       document.addEventListener('DOMContentLoaded',updateProgress);
   </script>
</body>
</html>
