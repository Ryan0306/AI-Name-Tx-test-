<!DOCTYPE html>
<html lang="zh-HK">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>命名練習：水果</title>
   <style>
       body{
           font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", Arial, sans-serif;
           display:flex;
           flex-direction:column;
           align-items:center;
           justify-content:space-between;
           min-height:100vh;
           margin:0;
           background:#f4f4f9;
           color:#333;
       }
       /* 滿分煙花畫布（不阻擋點擊操作） */
       #fireworks-canvas {
           position: fixed;
           inset: 0;
           width: 100%;
           height: 100%;
           pointer-events: none;
           z-index: 999;
           display: none;
       }
       .container{
           width:92%;
           max-width:800px;
           text-align:center;
           padding:20px 12px;
           display:flex;
           flex-direction:column;
           align-items:center;
           flex-grow:1;
           box-sizing:border-box;
           position: relative;
           z-index: 1;
       }
       /* 右上角低調設定按鈕（供治療師直接跳轉查看紀錄） */
       #quick-records-btn {
           position: absolute;
           top: 14px;
           right: 8px;
           background: transparent;
           color: #999;
           border: none;
           font-size: 1.45rem;
           padding: 6px 10px;
           border-radius: 8px;
           cursor: pointer;
           opacity: 0.55;
           transition: opacity 0.2s, background-color 0.2s;
           touch-action: manipulation;
       }
       #quick-records-btn:hover {
           opacity: 1;
           background-color: rgba(0, 0, 0, 0.05);
           color: #555;
       }

       h1{margin-bottom:12px;font-size:2em;}

       /* 視覺狀態回饋標籤 */
       #status-badge {
           display: none;
           padding: 10px 26px;
           border-radius: 30px;
           font-size: clamp(1.15rem, 4.2vw, 1.35rem);
           font-weight: bold;
           margin-bottom: 15px;
           transition: all 0.3s ease;
           white-space: nowrap;
       }
       .status-speaking {
           background-color: #fff3cd;
           color: #856404;
           border: 2px solid #ffeeba;
       }
       .status-listening {
           background-color: #d4edda;
           color: #155724;
           border: 2px solid #28a745;
           animation: pulse-green 1.5s infinite;
       }
       .status-idle {
           background-color: #e2e3e5;
           color: #383d41;
           border: 2px solid #d6d8db;
       }
       @keyframes pulse-green {
           0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.45); }
           70% { box-shadow: 0 0 0 12px rgba(40, 167, 69, 0); }
           100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
       }

       #item-image{
           max-width:90%;
           height:auto;
           max-height:48vh;
           border:5px solid #fff;
           box-shadow:0 4px 15px rgba(0,0,0,.1);
           border-radius:12px;
           margin:10px auto;
           display:block;
           transition: border-color 0.3s ease, box-shadow 0.3s ease;
       }
       #item-image.listening-highlight {
           border-color: #28a745;
           box-shadow: 0 0 20px rgba(40, 167, 69, 0.35);
       }

       #message{
           font-size: clamp(1.5rem, 5vw, 2.1rem);
           color: #333;
           min-height: 60px;
           margin: 12px 0;
           font-weight: bold;
           line-height: 1.4;
       }

       .btn-base {
           color: #fff;
           border: none;
           border-radius: 12px;
           cursor: pointer;
           white-space: nowrap;
           touch-action: manipulation;
       }
       #cue-button{
           background:#007bff;
           padding: 14px 40px;
           font-size: 1.5em;
           margin: 10px 0;
       }
       #cue-button:hover{background:#0056b3}

       #perm-button{
           background:#ff9800;
           padding: 16px 24px;
           font-size: clamp(1.15rem, 4.3vw, 1.55rem);
           max-width: 100%;
           box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
       }
       #perm-button:hover{background:#e68900}
