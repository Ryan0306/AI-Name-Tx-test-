<!DOCTYPE html>
<html lang="zh-HK">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>命名練習：水果</title>
   <style>
       body{
           font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", Arial, sans-serif;
           display:flex;
           flex-direction:column;
           align-items:center;
           justify-content:space-between;
           min-height:100vh;
           margin:0;
           background:#f4f4f9;
           color:#333;
       }
       .container{
           width:92%;
           max-width:800px;
           text-align:center;
           padding:20px 12px;
           display:flex;
           flex-direction:column;
           align-items:center;
           flex-grow:1;
           box-sizing:border-box;
       }
       h1{margin-bottom:12px;font-size:2em;}

       /* 視覺狀態回饋標籤 */
       #status-badge {
           display: none;
           padding: 10px 26px;
           border-radius: 30px;
           font-size: clamp(1.15rem, 4.2vw, 1.35rem);
           font-weight: bold;
           margin-bottom: 15px;
           transition: all 0.3s ease;
           white-space: nowrap;
       }
       .status-speaking {
           background-color: #fff3cd;
           color: #856404;
           border: 2px solid #ffeeba;
       }
       .status-listening {
           background-color: #d4edda;
           color: #155724;
           border: 2px solid #28a745;
           animation: pulse-green 1.5s infinite;
       }
       .status-idle {
           background-color: #e2e3e5;
           color: #383d41;
           border: 2px solid #d6d8db;
       }
       @keyframes pulse-green {
           0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.45); }
           70% { box-shadow: 0 0 0 12px rgba(40, 167, 69, 0); }
           100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
       }

       #item-image{
           max-width:90%;
           height:auto;
           max-height:48vh;
           border:5px solid #fff;
           box-shadow:0 4px 15px rgba(0,0,0,.1);
           border-radius:12px;
           margin:10px auto;
           display:block;
           transition: border-color 0.3s ease, box-shadow 0.3s ease;
       }
       #item-image.listening-highlight {
           border-color: #28a745;
           box-shadow: 0 0 20px rgba(40, 167, 69, 0.35);
       }

       #message{
           font-size: clamp(1.5rem, 5vw, 2.1rem);
           min-height:60px;
           margin:12px 0;
           font-weight:bold;
           line-height:1.4;
       }

       /* 共用按鈕基礎樣式 */
       button {
           color: #fff;
           border: none;
           border-radius: 12px;
           cursor: pointer;
           white-space: nowrap;
       }
       #cue-button{
           background:#007bff;
           padding:14px 40px;
           font-size:1.5em;
           margin:10px 0;
       }
       #cue-button:hover{background:#0056b3}

       #perm-button{
           background:#ff9800;
           padding: 16px 24px;
           font-size: clamp(1.15rem, 4.3vw, 1.55rem);
           max-width: 100%;
           box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
       }
       #perm-button:hover{background:#e68900}

       .action-buttons {
           display: flex;
           flex-direction: column;
           align-items: center;
           gap: 14px;
           width: 100%;
           margin-top: 10px;
       }

       #review-wrong-button{
           background:#ff9800;
           padding: 16px 32px;
           font-size: clamp(1.2rem, 4.5vw, 1.55rem);
           display:none;
           box-shadow: 0 4px 10px rgba(255, 152, 0, 0.25);
       }
       #review-wrong-button:hover{background:#e68900}

       #start-button{
           background:#28a745;
           padding: 16px 42px;
           font-size: clamp(1.25rem, 4.8vw, 1.65rem);
           display:none;
       }
       #start-button:hover{background:#1e7e34}

       /* 成績總結表樣式 */
       #summary-container {
           display: none;
           width: 100%;
           max-width: 600px;
           background: #fff;
           border-radius: 14px;
           padding: 18px 16px;
           box-shadow: 0 4px 15px rgba(0,0,0,0.08);
           margin: 8px 0 18px 0;
           text-align: left;
           box-sizing: border-box;
       }
       .summary-header {
           font-size: clamp(1.25rem, 4.6vw, 1.55rem);
           font-weight: bold;
           text-align: center;
           white-space: nowrap;
           margin-bottom: 12px;
           padding-bottom: 10px;
           border-bottom: 2px solid #f0f0f0;
       }
       .summary-list {
           list-style: none;
           padding: 0;
           margin: 0;
       }
       .summary-item {
           display: flex;
           justify-content: space-between;
           align-items: center;
           padding: 12px 10px;
           border-bottom: 1px solid #eee;
           font-size: clamp(1.15rem, 4.2vw, 1.35rem);
       }
       .summary-item:last-child { border-bottom: none; }
       .summary-word { font-weight: bold; color: #222; }
       .badge-correct, .badge-cue, .badge-repeat {
           padding: 5px 12px;
           border-radius: 20px;
           font-weight: bold;
           font-size: 0.9em;
           white-space: nowrap;
       }
       .badge-correct { background: #d4edda; color: #155724; }
       .badge-cue { background: #fff3cd; color: #856404; }
       .badge-repeat { background: #f8d7da; color: #721c24; }

       .progress-bar-container{
           width:100%;
           max-width:800px;
           margin-top:auto;
           padding:10px;
           background:#e9ecef;
           border-top:1px solid #ddd;
           box-sizing:border-box;
       }
       #progress-bar{
           height:38px;
           background:#ffc107;
           border-radius:6px;
           transition:width .5s;
           display:flex;
           align-items:center;
           justify-content:center;
           font-weight:bold;
           font-size:1.3em;
       }
   </style>
</head>
<body>
   <div class="container">
       <h1>命名練習：水果</h1>
       <div id="status-badge" class="status-idle">準備中...</div>
       <img id="item-image" src="" alt="目標物品圖片" style="display:none">
       <button id="cue-button" style="display:none">提示</button>
       <div id="message">開啟麥克風及聲音權限</div>
       
       <div id="summary-container">
           <div class="summary-header" id="summary-score">練習記錄</div>
           <ul class="summary-list" id="summary-list"></ul>
       </div>

       <button id="perm-button">🎤 開啟麥克風及聲音權限</button>
       
       <div class="action-buttons">
           <button id="review-wrong-button">🔄 重溫做錯嘅題目</button>
           <button id="start-button">開始練習</button>
       </div>
   </div>
   <div class="progress-bar-container"><div id="progress-bar"></div></div>

       const statusBadge = document.getElementById('status-badge');

       const summaryList = document.getElementById('summary-list');
       const summaryScore = document.getElementById('summary-score');
       const synth = window.speechSynthesis;

       function shuffleArray(arr) {
           for (let i = arr.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [arr[i], arr[j]] = [arr[j], arr[i]];
           }
       }

       function preloadImages() {
           allQuestions.forEach(q => { new Image().src = q.image; });
       }
